name: nunchuk-windows-x64

env:
  QT_VERSION: '6.9.3'
  QT_ARCH: win64_msvc2022_64
  QT_DIR_NAME: msvc2022_64
  CMAKE_VERSION: '3.31.0'
  CMAKE_WINDOWS_SHA256: 'f4b499f71cf44115a1d711d4867da3c6bd2f3f4d7121c213ace979757640385c'
  PYTHON_VERSION: '3.11.9'
  AQTINSTALL_VERSION: '3.3.0'
  PY7ZR_VERSION: '1.1.0'
  # Ninja 1.13.0 có regression response-file với MSVC:
  # https://github.com/ninja-build/ninja/issues/2616
  NINJA_VERSION: '1.11.1.1'
  NINJA_BINARY_VERSION: '1.11.1.git.kitware.jobserver-1'
  MSVC_VERSION: '2022'
  MSVC_TOOLSET_VERSION: '14.44.35207'
  WINDOWS_SDK_VERSION: '10.0.22621.0'
  INNO_SETUP_VERSION: '6.7.1'
  VCPKG_COMMIT: 'f523208df4ae467436dc2d2eeab594fed240d552'
  LIBEVENT_VERSION: '2.1.12+20230128#1'
  LIBEVENT_SOURCE_REF: '4d85d28acdbb83bb60e500e9345bab757b64d6d1'
  # Qt official MSVC dùng CRT động (/MD). Giữ dependency là static archive để
  # giảm DLL phải deploy, nhưng toàn bộ process phải dùng cùng CRT động.
  VCPKG_TRIPLET: x64-windows-static-md
  VC_REDIST: vc_redist.x64.exe
  TARGET_ARCH: x64
  TARGET_MACHINE_PATTERN: '8664 machine \(x64\)'
  INSTALLER_ARCH_ALLOWED: x64os
  INSTALLER_64BIT_MODE: x64os
  UPLOAD_BUILT: 'false'

on:
  push:
    tags:
    - '*'
  workflow_dispatch:
  
jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2022

    steps:
      - name: Check out repository
        # actions/checkout v4; pin SHA để tag v4 không tự thay đổi.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        
      - name: Check Windows Version
        shell: pwsh
        run: systeminfo | findstr /B /C:"OS Name" /C:"OS Version"

      # Nạp môi trường MSVC (cl.exe, nmake, INCLUDE/LIB, PATH) cho MỌI step sau.
      # Cần thiết vì CMake generator "Visual Studio" không dò được VS trên runner
      # này (COM/vswhere của CMake fail) trong khi cl.exe vẫn tồn tại — bằng chứng
      # là vcpkg build boost thành công. Với env này + generator Ninja, CMake gọi
      # thẳng cl.exe từ PATH, không phụ thuộc cơ chế dò VS.
      - name: Setup MSVC developer environment
        # ilammy/msvc-dev-cmd v1; pin action + compiler + Windows SDK.
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
          vsversion: ${{ env.MSVC_VERSION }}
          toolset: ${{ env.MSVC_TOOLSET_VERSION }}
          sdk: ${{ env.WINDOWS_SDK_VERSION }}

      - name: Verify MSVC target architecture
        shell: pwsh
        run: |
          if ($env:VSCMD_ARG_TGT_ARCH -ne $env:TARGET_ARCH) {
            Write-Error "MSVC target sai: expected=$env:TARGET_ARCH actual=$env:VSCMD_ARG_TGT_ARCH"
            exit 1
          }
          Get-Command cl.exe, dumpbin.exe -ErrorAction Stop | `
            Select-Object Name, Source
          $clCommand = Get-Command cl.exe -ErrorAction Stop
          $dumpbinCommand = Get-Command dumpbin.exe -ErrorAction Stop
          @($clCommand, $dumpbinCommand) | Select-Object Name, Source
          if ([string]::IsNullOrWhiteSpace($env:VCToolsInstallDir)) {
            Write-Error "VCToolsInstallDir không được thiết lập."
            exit 1
          }
          $toolRoot = (Resolve-Path $env:VCToolsInstallDir).Path.TrimEnd('\')
          foreach ($command in @($clCommand, $dumpbinCommand)) {
            $expectedPrefix = "$toolRoot\"
            if (!$command.Source.StartsWith(
                $expectedPrefix,
                [System.StringComparison]::OrdinalIgnoreCase
              )) {
              Write-Error "$($command.Name) nằm ngoài toolset đã pin: $($command.Source)"
              exit 1
            }
          }
          $actualToolset = $env:VCToolsVersion.TrimEnd('\')
          $actualSdk = $env:WindowsSDKVersion.TrimEnd('\')
          if ($actualToolset -ne $env:MSVC_TOOLSET_VERSION) {
            Write-Error "MSVC toolset sai: expected=$env:MSVC_TOOLSET_VERSION actual=$actualToolset"
            exit 1
          }
          if ($actualSdk -ne $env:WINDOWS_SDK_VERSION) {
            Write-Error "Windows SDK sai: expected=$env:WINDOWS_SDK_VERSION actual=$actualSdk"
            exit 1
          }
          'int main() { return 0; }' | Set-Content toolchain-probe.cpp `
            -Encoding ASCII
          & cl.exe /nologo /Bv /c toolchain-probe.cpp /Fotoolchain-probe.obj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $headers = & dumpbin.exe /HEADERS toolchain-probe.obj 2>&1 | `
          $clOutput = @(
            & $clCommand.Source /nologo /Bv /c toolchain-probe.cpp `
              /Fotoolchain-probe.obj 2>&1
          )
          $clExitCode = $LASTEXITCODE
          $clOutput | ForEach-Object { Write-Host $_ }
          if ($clExitCode -ne 0) {
            Write-Host "::error::cl.exe thất bại với exit code $clExitCode"
            exit $clExitCode
          }
          $headers = & $dumpbinCommand.Source /HEADERS `
            toolchain-probe.obj 2>&1 | `
            Out-String
          if ($LASTEXITCODE -ne 0 -or `
          $dumpbinExitCode = $LASTEXITCODE
          if ($dumpbinExitCode -ne 0 -or `
              $headers -notmatch $env:TARGET_MACHINE_PATTERN) {
            Write-Error "MSVC không tạo object $env:TARGET_ARCH hợp lệ."
            exit 1
          }
          Write-Host "MSVC/SDK pin: PASS ($actualToolset, $actualSdk, $env:TARGET_ARCH)"

      - name: Install pinned CMake
        shell: pwsh
        run: |
          $version = $env:CMAKE_VERSION
          $uri = "https://github.com/Kitware/CMake/releases/download/v$version/cmake-$version-windows-x86_64.zip"
          $zipPath = "$env:RUNNER_TEMP\cmake-$version.zip"
          $cmakeDir = "$env:RUNNER_TEMP\cmake-$version"
      
          Invoke-WebRequest -Uri $uri -OutFile $zipPath
          $actualHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -cne $env:CMAKE_WINDOWS_SHA256) {
            Write-Error "CMake checksum mismatch: expected=$env:CMAKE_WINDOWS_SHA256 actual=$actualHash"
            exit 1
          }
          Expand-Archive -Path $zipPath -DestinationPath $cmakeDir -Force
      
          $binPath = "$cmakeDir\cmake-$version-windows-x86_64\bin"
          echo "$binPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          
      - name: Check CMake version
        shell: pwsh
        run: |
          $firstLine = (& cmake --version | Select-Object -First 1).Trim()
          if ($LASTEXITCODE -ne 0 -or $firstLine -ne "cmake version $env:CMAKE_VERSION") {
            Write-Error "CMake sai version: expected=$env:CMAKE_VERSION actual='$firstLine'"
          $cmakeOutput = @(& cmake --version 2>&1)
          $cmakeExitCode = $LASTEXITCODE
          $firstLine = ([string]($cmakeOutput | Select-Object -First 1)).Trim()

          if ($cmakeExitCode -ne 0) {
            Write-Error "Không chạy được CMake: exit_code=$cmakeExitCode output='$firstLine'"
            exit 1
          }

          $versionMatches = @($cmakeOutput | ForEach-Object {
            $line = ([string]$_).Trim()
            if ($line -match '^cmake version\s+([0-9]+(?:\.[0-9]+)+)\s*$') {
              [PSCustomObject]@{
                Line = $line
                Version = $Matches[1]
              }
            }
          })
          if ($versionMatches.Count -ne 1) {
            Write-Error "Không đọc được duy nhất một CMake version từ output: '$($cmakeOutput -join ' | ')'"
            exit 1
          }

          $actualVersion = $versionMatches[0].Version
          if ($actualVersion -cne $env:CMAKE_VERSION) {
            Write-Error "CMake sai version: expected=$env:CMAKE_VERSION actual=$actualVersion"
            exit 1
          }

          Get-Command cmake.exe | Select-Object Name, Source
          Write-Host "${firstLine}: PASS"
          Write-Host "CMake version pin: PASS ($actualVersion)"

      - name: Set up Python
        # actions/setup-python v5; pin action và Python patch version.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      - name: Install pinned Python build tools
        shell: pwsh
        run: |
          $pythonOutput = @(
            & python -c "import platform; print(platform.python_version())" 2>&1
          )
          $pythonExitCode = $LASTEXITCODE
          $actualPythonVersion = `
            ([string]($pythonOutput | Select-Object -First 1)).Trim()
          if ($pythonExitCode -ne 0) {
            Write-Error "Không chạy được Python: exit_code=$pythonExitCode output='$actualPythonVersion'"
            exit 1
          }
          if ($actualPythonVersion -notmatch '^\d+\.\d+\.\d+$' -or `
              $actualPythonVersion -cne $env:PYTHON_VERSION) {
            Write-Error "Python sai version: expected=$env:PYTHON_VERSION actual='$actualPythonVersion'"
            exit 1
          }

          python -m pip install `
            "aqtinstall==$env:AQTINSTALL_VERSION" `
            "py7zr==$env:PY7ZR_VERSION" `
            "ninja==$env:NINJA_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pipInstallExitCode = $LASTEXITCODE
          if ($pipInstallExitCode -ne 0) { exit $pipInstallExitCode }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import py7zr; assert py7zr.__version__ == '$env:PY7ZR_VERSION', py7zr.__version__"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ninjaLine = (& ninja --version).Trim()
          if ($LASTEXITCODE -ne 0 -or `
              $ninjaLine -ne $env:NINJA_BINARY_VERSION) {
          $pipCheckExitCode = $LASTEXITCODE
          if ($pipCheckExitCode -ne 0) { exit $pipCheckExitCode }

          $packageOutput = @(
            & python -c "import importlib.metadata as m, json; print(json.dumps({p: m.version(p) for p in ('aqtinstall', 'py7zr', 'ninja')}))" 2>&1
          )
          $packageExitCode = $LASTEXITCODE
          $packageLine = `
            ([string]($packageOutput | Select-Object -First 1)).Trim()
          if ($packageExitCode -ne 0) {
            Write-Error "Không đọc được version package Python: exit_code=$packageExitCode output='$packageLine'"
            exit 1
          }
          try {
            $packageVersions = $packageLine | ConvertFrom-Json -ErrorAction Stop
          } catch {
            Write-Error "Package version JSON không hợp lệ: '$packageLine'"
            exit 1
          }
          $expectedPackages = @{
            aqtinstall = $env:AQTINSTALL_VERSION
            py7zr = $env:PY7ZR_VERSION
            ninja = $env:NINJA_VERSION
          }
          foreach ($packageName in $expectedPackages.Keys) {
            $actualPackageVersion = [string](
              $packageVersions.PSObject.Properties[$packageName].Value
            )
            if ($actualPackageVersion -cne $expectedPackages[$packageName]) {
              Write-Error "$packageName sai version: expected=$($expectedPackages[$packageName]) actual='$actualPackageVersion'"
              exit 1
            }
          }

          $ninjaOutput = @(& ninja --version 2>&1)
          $ninjaExitCode = $LASTEXITCODE
          $ninjaLine = `
            ([string]($ninjaOutput | Select-Object -First 1)).Trim()
          if ($ninjaExitCode -ne 0) {
            Write-Error "Không chạy được Ninja: exit_code=$ninjaExitCode output='$ninjaLine'"
            exit 1
          }
          if ($ninjaLine -cne $env:NINJA_BINARY_VERSION) {
            Write-Error "Ninja sai version binary: expected=$env:NINJA_BINARY_VERSION actual='$ninjaLine'"
            exit 1
          }
          Write-Host "Python tools pin: PASS"
          Write-Host "Python tools pin: PASS (Python $actualPythonVersion, Ninja $ninjaLine)"
  
      - name: Install Qt 6.9.3 (MSVC 2022)
        shell: pwsh
        run: |
          $modules = @(
            "qtmultimedia",
            "qtwebengine",
            "qtwebchannel",
            "qtpositioning",
            "qt5compat",
            "qtshadertools",
            "qtnetworkauth"
          )

          & aqt install-qt windows desktop "$env:QT_VERSION" "$env:QT_ARCH" `
            --outputdir C:\qt `
            -m $modules

          $aqtExitCode = $LASTEXITCODE
          if ($aqtExitCode -ne 0) {
            Write-Error "aqt install-qt thất bại với exit code $aqtExitCode"
            exit $aqtExitCode
          }

          $qtDir = "C:\qt\$env:QT_VERSION\$env:QT_DIR_NAME"
          $required = @(
            "$qtDir\bin\Qt6Core.dll",
            "$qtDir\bin\Qt6ShaderTools.dll",
            "$qtDir\bin\Qt6WebEngineCore.dll",
            "$qtDir\bin\Qt6WebEngineWidgets.dll",
            "$qtDir\bin\qmake.exe",
            "$qtDir\bin\windeployqt.exe"
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              Write-Error "Qt runtime bắt buộc không tồn tại: $file"
              exit 1
            }
          }

          $qtVersionOutput = @(
            & "$qtDir\bin\qmake.exe" -query QT_VERSION 2>&1
          )
          $qtVersionExitCode = $LASTEXITCODE
          $actualQtVersion = `
            ([string]($qtVersionOutput | Select-Object -First 1)).Trim()
          if ($qtVersionExitCode -ne 0) {
            Write-Error "Không đọc được Qt version: exit_code=$qtVersionExitCode output='$actualQtVersion'"
            exit 1
          }
          if ($actualQtVersion -cne $env:QT_VERSION) {
            Write-Error "Qt sai version: expected=$env:QT_VERSION actual='$actualQtVersion'"
            exit 1
          }

          $qtHeaders = & dumpbin.exe /HEADERS "$qtDir\bin\Qt6Core.dll" `
            2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or `
          $qtDumpbinExitCode = $LASTEXITCODE
          if ($qtDumpbinExitCode -ne 0 -or `
              $qtHeaders -notmatch $env:TARGET_MACHINE_PATTERN) {
            Write-Error "Qt6Core.dll không đúng kiến trúc $env:TARGET_ARCH."
            exit 1
          }

          $effectsPlugin = Get-ChildItem `
            "$qtDir\qml\Qt5Compat\GraphicalEffects\private" `
            -Filter "*graphicaleffectsprivateplugin.dll" `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $effectsPlugin) {
            Write-Error "Qt5Compat GraphicalEffects private plugin không tồn tại."
            exit 1
          }

          "QT_DIR=$qtDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Qt version pin: PASS ($actualQtVersion)"
          "QT_QML_DIR=$qtDir\qml" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "$qtDir\bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Qt installed at: $qtDir"
      
      # Không cache cả checkout/installed của vcpkg: cache cũ từng che mất
      # lỗi cold-build và có thể trộn binary từ compiler khác. Chỉ cache
      # source archive + binary package có ABI key của vcpkg.
      - name: Prepare isolated vcpkg caches
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force `
            "${{ github.workspace }}\vcpkg-downloads", `
            "${{ github.workspace }}\vcpkg-binary-cache" | Out-Null

      - name: Restore vcpkg downloads and binary packages
        id: cache-vcpkg
        # actions/cache v4; pin SHA để tag v4 không tự thay đổi.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ github.workspace }}/vcpkg-downloads
            ${{ github.workspace }}/vcpkg-binary-cache
          key: vcpkg-binary-v2-${{ runner.os }}-${{ env.MSVC_TOOLSET_VERSION }}-${{ env.WINDOWS_SDK_VERSION }}-${{ env.CMAKE_VERSION }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('.github/workflows/nunchuk-window-x64.yml') }}
          restore-keys: |
            vcpkg-binary-v2-${{ runner.os }}-${{ env.MSVC_TOOLSET_VERSION }}-${{ env.WINDOWS_SDK_VERSION }}-${{ env.CMAKE_VERSION }}-${{ env.VCPKG_COMMIT }}-

      - name: Report vcpkg cache state
        shell: pwsh
        run: Write-Host "vcpkg cache exact hit = ${{ steps.cache-vcpkg.outputs.cache-hit }}"

      - name: Set up vcpkg
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          # Luôn tạo checkout sạch; chỉ fetch đúng commit đã pin.
          if (Test-Path "vcpkg") {
            Remove-Item "vcpkg" -Recurse -Force
          }
          git init vcpkg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C vcpkg remote add origin https://github.com/microsoft/vcpkg.git
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C vcpkg fetch --depth 1 origin $env:VCPKG_COMMIT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C vcpkg checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $actualCommit = (& git -C vcpkg rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualCommit -cne $env:VCPKG_COMMIT) {
          $commitOutput = @(& git -C vcpkg rev-parse HEAD 2>&1)
          $commitExitCode = $LASTEXITCODE
          $actualCommit = `
            ([string]($commitOutput | Select-Object -First 1)).Trim()
          if ($commitExitCode -ne 0) {
            Write-Error "Không đọc được vcpkg commit: exit_code=$commitExitCode output='$actualCommit'"
            exit 1
          }
          if ($actualCommit -cne $env:VCPKG_COMMIT) {
            Write-Error "vcpkg commit sai: expected=$env:VCPKG_COMMIT actual=$actualCommit"
            exit 1
          }

          # Khóa cả version port lẫn source commit của libevent.
          $libeventManifestPath = "vcpkg\ports\libevent\vcpkg.json"
          $libeventManifest = Get-Content $libeventManifestPath -Raw | `
            ConvertFrom-Json
          $actualLibeventVersion = $libeventManifest.version
          if ($libeventManifest.'port-version' -gt 0) {
            $actualLibeventVersion += "#$($libeventManifest.'port-version')"
          }
          $libeventPortfile = Get-Content `
            "vcpkg\ports\libevent\portfile.cmake" -Raw
          $sourcePattern = "(?m)^\s*REF\s+" + `
            [regex]::Escape($env:LIBEVENT_SOURCE_REF) + "\s*$"
          if ($actualLibeventVersion -cne $env:LIBEVENT_VERSION -or `
              $libeventPortfile -notmatch $sourcePattern) {
            Write-Error "libevent pin sai: version=$actualLibeventVersion source=$env:LIBEVENT_SOURCE_REF"
            exit 1
          }

          $vcpkgRoot = (Resolve-Path "vcpkg").Path

          # Community triplet gốc không khóa MSVC minor/SDK. Checkout này
          # là ephemeral nên materialize triplet chính xác trước bootstrap.
          $tripletFile = `
            "$vcpkgRoot\triplets\community\$env:VCPKG_TRIPLET.cmake"
          @"
          set(VCPKG_TARGET_ARCHITECTURE x64)
          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_LIBRARY_LINKAGE static)
          set(VCPKG_PLATFORM_TOOLSET v143)
          set(VCPKG_PLATFORM_TOOLSET_VERSION "$env:MSVC_TOOLSET_VERSION")
          set(VCPKG_CMAKE_SYSTEM_VERSION "$env:WINDOWS_SDK_VERSION")
          "@ | Set-Content $tripletFile -Encoding ASCII

          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # msvc-dev-cmd đặt VCPKG_ROOT tới bản vcpkg đi kèm Visual Studio.
          # Workflow dùng bản đã pin trong workspace nên ghi đè cho mọi step sau.
          "VCPKG_ROOT=$vcpkgRoot" | `
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DOWNLOADS=${{ github.workspace }}\vcpkg-downloads" | `
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $binaryCache = `
            "${{ github.workspace }}\vcpkg-binary-cache"
          "VCPKG_BINARY_SOURCES=clear;files,$binaryCache,readwrite" | `
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "VCPKG_ROOT=$vcpkgRoot"
          Write-Host "vcpkg/libevent pin: PASS ($actualCommit, $actualLibeventVersion)"
          
      - name: Install dependencies with vcpkg
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $tripletFile = @(
            "$env:VCPKG_ROOT\triplets\$env:VCPKG_TRIPLET.cmake",
            "$env:VCPKG_ROOT\triplets\community\$env:VCPKG_TRIPLET.cmake"
          ) | Where-Object { Test-Path $_ -PathType Leaf } | `
            Select-Object -First 1
          if (!$tripletFile) {
            Write-Error "vcpkg triplet không tồn tại: $env:VCPKG_TRIPLET"
            exit 1
          }
          $triplet = Get-Content $tripletFile -Raw
          if ($triplet -notmatch 'VCPKG_LIBRARY_LINKAGE\s+static' -or `
              $triplet -notmatch 'VCPKG_CRT_LINKAGE\s+dynamic') {
            Write-Error "Triplet phải dùng static libraries + dynamic CRT (/MD)."
            Get-Content $tripletFile
            exit 1
          }
          Write-Host "vcpkg linkage: static libraries + dynamic CRT (/MD): PASS"

          $packages = @(
            # Chỉ cài các module được include trong branch qt6, libnunchuk và
            # nested Bitcoin Core.
            # Metaport "boost" kéo cả Boost.Python -> Python -> libffi -> MSYS2,
            # dù app không sử dụng, làm build phụ thuộc các archive MSYS đã cũ.
            "boost-algorithm",
            "boost-asio",
            "boost-bind",
            "boost-format",
            "boost-multi-index",
            "boost-process",
            "boost-signals2",
            "boost-tokenizer",
            "zeromq",
            "openssl",
            "berkeleydb",
            "sqlite3"
          ) | ForEach-Object { "${_}:$env:VCPKG_TRIPLET" }

          # Cài riêng libevent để cold-build fail nhanh và log rõ. Biến
          # policy là fallback cho lỗi CMake 4 đã được upstream xác nhận.
          $env:CMAKE_POLICY_VERSION_MINIMUM = '3.5'
          $libeventSpec = "libevent:$env:VCPKG_TRIPLET"
          & "$env:VCPKG_ROOT\vcpkg.exe" install --debug $libeventSpec
          if ($LASTEXITCODE -ne 0) {
            $vcpkgExitCode = $LASTEXITCODE
            Write-Host "---- libevent failure logs ----"
            Get-ChildItem "$env:VCPKG_ROOT\buildtrees\libevent" -Recurse `
              -File -ErrorAction SilentlyContinue | Where-Object {
                $_.Extension -in @('.log', '.txt')
              } | Sort-Object FullName | ForEach-Object {
                Write-Host "::group::$($_.FullName)"
                Get-Content $_.FullName -Tail 250 -ErrorAction Continue
                Write-Host "::endgroup::"
              }
            Write-Error "libevent vcpkg install thất bại với exit code $vcpkgExitCode"
            exit $vcpkgExitCode
          }

          # SQLCipher không hỗ trợ triplet static trong vcpkg và không cần cài:
          # libnunchuk tự build target sqlcipher từ contrib/sqlite.
          & "$env:VCPKG_ROOT\vcpkg.exe" install @packages
          if ($LASTEXITCODE -ne 0) {
            $vcpkgExitCode = $LASTEXITCODE
            Write-Error "vcpkg install thất bại với exit code $vcpkgExitCode"
            exit $vcpkgExitCode
          }

          # Không dùng `vcpkg integrate install`: CMake đã nhận toolchain file
          # rõ ràng, tránh tác động global và lỗi dọn thư mục Temp trên runner.
          $installedPackages = & "$env:VCPKG_ROOT\vcpkg.exe" list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installedPackages | ForEach-Object { Write-Host $_ }
          $libeventPattern = '^libevent:' + `
            [regex]::Escape($env:VCPKG_TRIPLET) + '\s+' + `
            [regex]::Escape($env:LIBEVENT_VERSION) + '(?:\s|$)'
          $installedLibevent = @($installedPackages | Where-Object {
            $_ -match $libeventPattern
          })
          if ($installedLibevent.Count -ne 1) {
            Write-Error "libevent installed không đúng pin $env:LIBEVENT_VERSION"
            exit 1
          }
          if ($installedPackages -match '^libffi:') {
            Write-Error "Dependency ngoài phạm vi libffi vẫn bị kéo vào build."
            exit 1
          }

          $boostInclude = "vcpkg\installed\$env:VCPKG_TRIPLET\include\boost"
          $requiredBoostHeaders = @(
            "algorithm\hex.hpp",
            "algorithm\string.hpp",
            "asio.hpp",
            "asio\ssl.hpp",
            "bind.hpp",
            "format.hpp",
            "multi_index\hashed_index.hpp",
            "multi_index_container.hpp",
            "operators.hpp",
            "process.hpp",
            "process\windows.hpp",
            "signals2.hpp",
            "tokenizer.hpp",
            "tuple\tuple.hpp"
          )
          foreach ($relativePath in $requiredBoostHeaders) {
            $header = Join-Path $boostInclude $relativePath
            if (!(Test-Path $header -PathType Leaf)) {
              Write-Error "Thiếu Boost header bắt buộc: $header"
              exit 1
            }
          }
          Write-Host "Boost module allowlist: PASS"

          # libnunchuk/contrib/libnunchuk/CMakeLists.txt tìm đúng thư viện
          # static với NAMES libevent.a event. Trên MSVC file tương ứng là
          # event.lib; kiểm tra ngay tại đây và truyền đường dẫn tuyệt đối cho
          # CMake để không phụ thuộc thứ tự search path.
          $eventLibraryPath = "vcpkg\installed\$env:VCPKG_TRIPLET\lib\event.lib"
          if (!(Test-Path $eventLibraryPath -PathType Leaf)) {
            Write-Error "libevent static không tồn tại: $eventLibraryPath"
            Get-ChildItem "vcpkg\installed\$env:VCPKG_TRIPLET\lib" `
              -Filter "*event*.lib" -ErrorAction SilentlyContinue | `
              Select-Object FullName
            exit 1
          }

          $eventHeaders = & dumpbin.exe /HEADERS $eventLibraryPath 2>&1 | `
            Out-String
          if ($LASTEXITCODE -ne 0 -or `
              $eventHeaders -notmatch $env:TARGET_MACHINE_PATTERN) {
            Write-Error "event.lib không đúng kiến trúc $env:TARGET_ARCH."
            exit 1
          }

          $eventLibrary = (Resolve-Path $eventLibraryPath).Path.Replace('\', '/')
          "EVENT_LIBRARY=$eventLibrary" | `
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "libevent static: PASS ($eventLibrary)"

      - name: Upload vcpkg libevent logs on failure
        if: failure()
        # actions/upload-artifact v4.6.2; pin SHA.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nunchuk-windows-x64-vcpkg-libevent-logs
          path: |
            vcpkg/buildtrees/libevent/**/*.log
            vcpkg/buildtrees/libevent/**/*.txt
            vcpkg/installed/vcpkg/issue_body.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Checkout Olm
        working-directory: ${{ github.workspace }}
        run: git clone --depth 1 --branch 3.2.16 https://gitlab.matrix.org/matrix-org/olm.git
      
      - name: Build Olm
        working-directory: ${{ github.workspace }}/olm
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="C:/olmInstalled" `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            -DBUILD_SHARED_LIBS=OFF `
            -DOLM_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $compileDbPath = "build/compile_commands.json"
          if (!(Test-Path $compileDbPath -PathType Leaf)) {
            Write-Error "Olm compile database không tồn tại: $compileDbPath"
            exit 1
          }
          $compileDb = Get-Content $compileDbPath -Raw
          if ($compileDb -match '(?i)(?:^|[\s"])[\/-]MTd?(?=[\s"]|$)') {
            Write-Error "Olm đang dùng static CRT (/MT), không tương thích Qt official."
            exit 1
          }
          if ($compileDb -notmatch '(?i)(?:^|[\s"])[\/-]MD(?=[\s"]|$)') {
            Write-Error "Không xác nhận được Olm đang dùng dynamic CRT (/MD)."
            exit 1
          }
          Write-Host "Olm MSVC runtime /MD: PASS"

          cmake --build build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (!(Test-Path "C:/olmInstalled/lib/cmake/Olm/OlmConfig.cmake")) {
            Write-Error "OlmConfig.cmake not found after install."
            exit 1
          }
          
      - name: Checkout QtKeychain
        working-directory: ${{ github.workspace }}
        run: |
          git clone --depth 1 --branch 0.14.2 https://github.com/frankosterfeld/qtkeychain.git
      
      - name: Build QtKeychain
        working-directory: ${{ github.workspace }}/qtkeychain
        run: |
          cmake -B build -S . `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=$env:VCPKG_TRIPLET `
            -DCMAKE_INSTALL_PREFIX="C:/qtkeychainInstalled" `
            -DCMAKE_PREFIX_PATH="$env:QT_DIR" `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            -DBUILD_WITH_QT6=ON `
            -DBUILD_TEST_APPLICATION=OFF `
            -DBUILD_TRANSLATIONS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $compileDbPath = "build/compile_commands.json"
          if (!(Test-Path $compileDbPath -PathType Leaf)) {
            Write-Error "QtKeychain compile database không tồn tại: $compileDbPath"
            exit 1
          }
          $compileDb = Get-Content $compileDbPath -Raw
          if ($compileDb -match '(?i)(?:^|[\s"])[\/-]MTd?(?=[\s"]|$)') {
            Write-Error "QtKeychain đang dùng static CRT (/MT)."
            exit 1
          }
          if ($compileDb -notmatch '(?i)(?:^|[\s"])[\/-]MD(?=[\s"]|$)') {
            Write-Error "Không xác nhận được QtKeychain đang dùng dynamic CRT (/MD)."
            exit 1
          }
          Write-Host "QtKeychain MSVC runtime /MD: PASS"

          cmake --build build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          echo "QTKEYCHAIN_PATH=C:/qtkeychainInstalled" >> $env:GITHUB_ENV
          
          $keychainDll = "C:/qtkeychainInstalled/bin/qt6keychain.dll"
          if (!(Test-Path $keychainDll)) {
            Write-Error "qt6keychain.dll not found at $keychainDll"
            exit 1
          }
          
      - name: Checkout nunchuk-qt
        working-directory: ${{ github.workspace }}
        env:
          GITLAB_PASS: ${{ secrets.GITLAB_PASS }}
        shell: pwsh
        run: |
          # Tạo ~/.netrc
          $netrcContent = "machine gitlab.com`n  login hadvluffy`n  password $env:GITLAB_PASS"
          $netrcPath = "$env:USERPROFILE\.netrc"
          $netrcContent | Out-File -FilePath $netrcPath -Encoding ASCII
      
          # Set biến môi trường
          $env:TARGET_BRANCH = "qt6"
          echo "BUILD_BRANCH=$env:TARGET_BRANCH" >> $env:GITHUB_ENV
      
          echo "Cloning fresh repository"
          if (Test-Path "nunchuk-qt") { Remove-Item -Recurse -Force "nunchuk-qt" }
          & git clone -b $env:TARGET_BRANCH `
          git clone -b $env:TARGET_BRANCH https://gitlab.com/nunchuck/nunchuck-qt nunchuk-qt
            https://gitlab.com/nunchuck/nunchuck-qt nunchuk-qt
          $gitExitCode = $LASTEXITCODE
          if ($gitExitCode -ne 0) {
            Write-Host "::error::git clone thất bại với exit code $gitExitCode"
            exit $gitExitCode
          }
          Set-Location nunchuk-qt
          git fetch --all --tags --force
          git submodule sync --recursive
          git submodule update --init --recursive
      
          $lastCommit = git rev-parse HEAD
          & git fetch --all --tags --force
          $gitExitCode = $LASTEXITCODE
          if ($gitExitCode -ne 0) {
            Write-Host "::error::git fetch thất bại với exit code $gitExitCode"
            exit $gitExitCode
          }
          & git submodule sync --recursive
          $gitExitCode = $LASTEXITCODE
          if ($gitExitCode -ne 0) {
            Write-Host "::error::git submodule sync thất bại với exit code $gitExitCode"
            exit $gitExitCode
          }
          & git submodule update --init --recursive
          $gitExitCode = $LASTEXITCODE
          if ($gitExitCode -ne 0) {
            Write-Host "::error::git submodule update thất bại với exit code $gitExitCode"
            exit $gitExitCode
          }

          $commitOutput = @(& git rev-parse HEAD 2>&1)
          $gitExitCode = $LASTEXITCODE
          $lastCommit = `
            ([string]($commitOutput | Select-Object -First 1)).Trim()
          $shaPattern = '^(?:[0-9a-f]{40}|[0-9a-f]{64})$'
          if ($gitExitCode -ne 0 -or $lastCommit -notmatch $shaPattern) {
            Write-Host "::error::Không đọc được commit nunchuk-qt hợp lệ: exit_code=$gitExitCode output='$lastCommit'"
            exit 1
          }
          echo "Latest commit ----->>>>> $lastCommit"
          echo "LAST_COMMITID=$lastCommit" >> $env:GITHUB_ENV
      
          $latestTag = git for-each-ref --sort=-taggerdate --format '%(refname:short)' refs/tags | Select-Object -First 1
          $currentCommit = git rev-parse HEAD
          $taggedCommit = git rev-list -n 1 $latestTag

          $tagOutput = @(
            & git for-each-ref --sort=-creatordate `
              '--format=%(refname:short)' refs/tags 2>&1
          )
          $gitExitCode = $LASTEXITCODE
          $latestTag = `
            ([string]($tagOutput | Select-Object -First 1)).Trim()
          if ($gitExitCode -ne 0 -or `
              [string]::IsNullOrWhiteSpace($latestTag)) {
            Write-Host "::error::Không tìm thấy tag nunchuk-qt hợp lệ: exit_code=$gitExitCode"
            exit 1
          }

          $taggedCommitOutput = @(& git rev-list -n 1 $latestTag 2>&1)
          $gitExitCode = $LASTEXITCODE
          $taggedCommit = `
            ([string]($taggedCommitOutput | Select-Object -First 1)).Trim()
          if ($gitExitCode -ne 0 -or $taggedCommit -notmatch $shaPattern) {
            Write-Host "::error::Không resolve được tag '$latestTag': exit_code=$gitExitCode output='$taggedCommit'"
            exit 1
          }
          $currentCommit = $lastCommit
          echo "Latest tag found: $latestTag (commit $taggedCommit)"
          echo "Current commit: $currentCommit"
          echo "LATEST_VERSION=$latestTag" >> $env:GITHUB_ENV

      # Source Windows cũ vừa ép /MT vừa bỏ MSVCRT khỏi default libraries.
      # Qt official dùng /MD, vì vậy phải chuẩn hoá cả compiler lẫn linker
      # trước khi configure; chỉ đổi /MT -> /MD là chưa đủ.
      - name: Normalize source MSVC runtime to dynamic CRT
        working-directory: ${{ github.workspace }}/nunchuk-qt
        shell: pwsh
        run: |
          $cmakeFiles = Get-ChildItem . -Recurse -File | Where-Object {
            $_.Name -eq "CMakeLists.txt" -or $_.Extension -eq ".cmake"
          }
          $changedFiles = @()

          foreach ($file in $cmakeFiles) {
            $original = Get-Content $file.FullName -Raw
            $updated = $original

            # Compiler flags cũ.
            $updated = $updated -replace `
              '(?<![A-Za-z0-9_])[/-]MTd(?![A-Za-z0-9_])', '/MDd'
            $updated = $updated -replace `
              '(?<![A-Za-z0-9_])[/-]MT(?![A-Za-z0-9_])', '/MD'

            # /MD tự thêm MSVCRT vào default libraries. Source hiện tại lại
            # có /NODEFAULTLIB:MSVCRT nên gây hàng loạt unresolved CRT symbols.
            # Không giữ bất kỳ biến thể /NODEFAULTLIB nào: với một graph /MD
            # đồng nhất, các cờ này không cần thiết và có thể loại CRT gián tiếp.
            $updated = $updated -replace `
              '(?i)(?<![A-Za-z0-9_])[/-]NODEFAULTLIB(?::[A-Za-z0-9_.-]+)?(?![A-Za-z0-9_])', ''
            # /Zl loại default-library directive khỏi từng object file.
            $updated = $updated -replace `
              '(?i)(?<![A-Za-z0-9_])[/-]Zl(?![A-Za-z0-9_])', ''

            # CMake MSVC_RUNTIME_LIBRARY property nếu source tự đặt static CRT.
            $updated = $updated -replace `
              'MultiThreaded\$<\$<CONFIG:Debug>:Debug>(?!DLL)', `
              'MultiThreaded$<$<CONFIG:Debug>:Debug>DLL'
            $updated = $updated -replace `
              '(?<![A-Za-z0-9_])MultiThreadedDebug(?!DLL|[A-Za-z0-9_])', `
              'MultiThreadedDebugDLL'
            $updated = $updated -replace `
              '(?<![A-Za-z0-9_])MultiThreaded(?!Debug|DLL|\$<|[A-Za-z0-9_])', `
              'MultiThreadedDLL'

            # Giữ khai báo vcpkg trong source đồng nhất với triplet
            # x64-windows-static-md (static libraries + dynamic CRT).
            $updated = $updated -replace `
              '(?im)(set\s*\(\s*VCPKG_CRT_LINKAGE\s+)static(\s*\))', `
              '${1}dynamic${2}'

            if ($updated -cne $original) {
              Set-Content $file.FullName $updated -Encoding UTF8 -NoNewline
              $changedFiles += $file.FullName
              Write-Host "Normalized CRT flags: $($file.FullName)"
            }
          }

          Write-Host "Normalized CMake files: $($changedFiles.Count)"

          # Chặn mọi khai báo static/suppressed CRT còn sót trong build scripts.
          $remaining = Get-ChildItem . -Recurse -File | Where-Object {
            $_.Name -eq "CMakeLists.txt" -or $_.Extension -eq ".cmake"
          } | Select-String -Pattern `
            '(?<![A-Za-z0-9_])[/-]MTd?(?![A-Za-z0-9_])|(?<![A-Za-z0-9_])MultiThreadedDebug(?!DLL|[A-Za-z0-9_])|(?<![A-Za-z0-9_])MultiThreaded(?!Debug|DLL|\$<|[A-Za-z0-9_])|(?i:(?<![A-Za-z0-9_])[/-]NODEFAULTLIB(?::[A-Za-z0-9_.-]+)?(?![A-Za-z0-9_]))|(?i:(?<![A-Za-z0-9_])[/-]Zl(?![A-Za-z0-9_]))|VCPKG_CRT_LINKAGE\s+static' `
            -AllMatches
          if ($remaining) {
            Write-Host "---- Invalid MSVC CRT declarations still present ----"
            $remaining | Select-Object Path, LineNumber, Line | Format-Table -AutoSize
            Write-Error "Source vẫn còn khai báo static hoặc suppressed CRT."
            exit 1
          }
          Write-Host "Source MSVC runtime normalization: PASS (/MD + default CRT)"
      
      - name: Generate build timestamp
        shell: pwsh
        run: |
          $timestamp = Get-Date -Format "yyyyMMddHHmmss"
          echo "Timestamp: $timestamp"
          echo "TIMESTAMP=$timestamp" >> $env:GITHUB_ENV

      - name: Check environment variants
        id: set-timestamp
        run: |
          echo "Timestamp build :>>> ${{ env.TIMESTAMP }}"
          echo "Version target build :>>> ${{ env.LATEST_VERSION }}"
          echo "Commit target build :>>> ${{ env.LAST_COMMITID }}"
          echo "Branch target build :>>> ${{ env.BUILD_BRANCH }}"
          
      - name: Configuration nunchuk-qt
        shell: pwsh
        env:
          toolchainFile: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          project_path: ${{ github.workspace }}/nunchuk-qt
          qt_keychain_installed: C:/qtkeychainInstalled
          build_mode: Release
          # OAuth secrets: giữ đồng bộ với workflow Linux/macOS.
          # Lưu ý: cmake bên Linux/macOS đọc 3 secret này qua biến môi trường,
          # nên ở đây chỉ cần expose ra env là CMake script nhận được.
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REDIRECT_URI: ${{ secrets.OAUTH_REDIRECT_URI }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
        run: |
          $qtDir = "$env:QT_DIR"
          $qtKeychain = "$env:QTKEYCHAIN_PATH"
          echo "Qt path :>>> $qtDir"
          echo "Qt keychain path :>>> $qtKeychain"

          # Generator Ninja gọi thẳng cl.exe từ env MSVC x64; không dùng -A
          # với Ninja single-config.
          $cmakeConfigureCmd = @(
            "-G", "Ninja",
            "-B", "build",
            "-S", "$env:project_path",
            "-DCMAKE_BUILD_TYPE=$env:build_mode",
            "-DCMAKE_TOOLCHAIN_FILE=$env:toolchainFile",
            "-DVCPKG_TARGET_TRIPLET=$env:VCPKG_TRIPLET",
            "-DCMAKE_POLICY_DEFAULT_CMP0091=NEW",
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL",
            "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON",
            "-Devent_lib:FILEPATH=$env:EVENT_LIBRARY",
            "-DUR__DISABLE_TESTS=ON",
            "-DQt6_DIR=$env:QT_DIR/lib/cmake/Qt6",
            "-DCMAKE_PREFIX_PATH=$env:QT_DIR;$env:qt_keychain_installed;C:/olmInstalled"
          )
          cmake @cmakeConfigureCmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $compileDbPath = "build/compile_commands.json"
          if (!(Test-Path $compileDbPath -PathType Leaf)) {
            Write-Error "CMake compile database không tồn tại: $compileDbPath"
            exit 1
          }
          $compileEntries = @(Get-Content $compileDbPath -Raw | ConvertFrom-Json)
          $mtEntries = @($compileEntries | Where-Object {
            $commandLine = if ($_.command) {
              $_.command
            } else {
              $_.arguments -join ' '
            }
            $commandLine -match '(?i)(?:^|[\s"])[\/-]MTd?(?=[\s"]|$)'
          })
          if ($mtEntries.Count -gt 0) {
            Write-Host "---- Compile commands still using /MT ----"
            $mtEntries | Select-Object -First 20 | ForEach-Object {
              Write-Host "Source: $($_.file)"
              if ($_.command) {
                Write-Host $_.command
              } else {
                Write-Host ($_.arguments -join ' ')
              }
            }
            Write-Error "Project còn compiler flag /MT; không được trộn CRT với Qt /MD."
            exit 1
          }
          $compileDb = Get-Content $compileDbPath -Raw
          if ($compileDb -notmatch '(?i)(?:^|[\s"])[\/-]MD(?=[\s"]|$)') {
            Write-Error "Không xác nhận được project đang dùng dynamic CRT (/MD)."
            exit 1
          }

          # compile_commands chỉ chứa compiler flags; linker flags nằm trong
          # graph Ninja. Kiểm tra riêng để không tái diễn /NODEFAULTLIB:MSVCRT.
          $buildGraphFiles = @(Get-ChildItem "build" -Recurse -File `
            -Filter "*.ninja")
          if ($buildGraphFiles.Count -eq 0) {
            Write-Error "Không tìm thấy Ninja build graph trong thư mục build."
            exit 1
          }
          $forbiddenLinkFlags = Select-String `
            -Path $buildGraphFiles.FullName -Pattern `
            '(?i)[/-]NODEFAULTLIB(?::[A-Za-z0-9_.-]+)?|(?:^|\s)[/-]Zl(?=\s|$)' `
            -AllMatches
          if ($forbiddenLinkFlags) {
            Write-Host "---- Linker flags suppressing dynamic CRT ----"
            $forbiddenLinkFlags | Select-Object -First 20 `
              Path, LineNumber, Line | Format-Table -AutoSize
            Write-Error "Build graph vẫn vô hiệu default MSVC CRT libraries."
            exit 1
          }
          Write-Host "nunchuk-qt MSVC runtime /MD + default CRT linkage: PASS"

      - name: Build nunchuk-qt
        shell: pwsh
        run: |
          # Ninja tự song song hoá; không có --config (single-config).
          cmake --build build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ----------------------------------------------------------------------
      # Deploy Qt runtime TRỰC TIẾP vào thư mục staging sạch.
      # Ninja là single-config nên exe nằm ở build\nunchuk-qt.exe (không có
      # subfolder Release). Copy exe sang staging rồi chạy windeployqt trên
      # exe đã staged -> mọi DLL/plugin Qt được đổ thẳng vào staging, tránh
      # rác build (CMakeCache, .obj, ...).
      # ----------------------------------------------------------------------
      - name: Deploy with windeployqt
        shell: pwsh
        env:
          project_path: ${{ github.workspace }}\nunchuk-qt
          qtkeychain_dll: C:/qtkeychainInstalled/bin/qt6keychain.dll
        run: |
          $windeployqt = "$env:QT_DIR\bin\windeployqt.exe"
          $built_exe = "build\nunchuk-qt.exe"
          $stage = "staging"

          if (!(Test-Path $windeployqt)) {
            Write-Error "❌ windeployqt not found at $windeployqt"
            exit 1
          }
          if (!(Test-Path $built_exe)) {
            Write-Error "❌ Executable not found at $built_exe"
            Get-ChildItem "build" | Select-Object Name
            exit 1
          }
          if (!(Test-Path $env:qtkeychain_dll -PathType Leaf)) {
            Write-Error "qt6keychain.dll not found at $env:qtkeychain_dll"
            exit 1
          }

          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item $built_exe -Destination $stage -Force

          # QtKeychain là DLL bên thứ ba: pre-stage đúng binary cạnh EXE để tạo
          # deployment hoàn chỉnh. Phần tương thích heuristic windeployqt nằm
          # ngay bên dưới.
          Copy-Item $env:qtkeychain_dll -Destination $stage -Force `
            -ErrorAction Stop
          $stagePath = (Resolve-Path $stage).Path
          $qtkeychainBin = Split-Path $env:qtkeychain_dll -Parent
          $env:PATH = "$stagePath;$qtkeychainBin;$env:QT_DIR\bin;$env:PATH"

          $keychainHeaders = & dumpbin.exe /HEADERS `
            "$stage\qt6keychain.dll" 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or `
              $keychainHeaders -notmatch $env:TARGET_MACHINE_PATTERN) {
            Write-Error "qt6keychain.dll không phải PE $env:TARGET_ARCH hợp lệ."
            exit 1
          }
          Write-Host "Pre-staged third-party runtime: qt6keychain.dll"

          # Qt 6.9.3 nhận mọi tên bắt đầu bằng "Qt6" là Qt module và luôn ghép
          # tên đó với QT_DIR\bin. qt6keychain.dll vô tình trúng heuristic này.
          # Mirror tạm đúng binary vào Qt bin để scanner đọc dependency, sau đó
          # luôn dọn lại và vẫn giữ chế độ fail cứng khi dependency thực sự lỗi.
          $scannerKeychain = "$env:QT_DIR\bin\qt6keychain.dll"
          $scannerShimCreated = $false
          if (Test-Path $scannerKeychain -PathType Leaf) {
            $existingHash = (Get-FileHash $scannerKeychain -Algorithm SHA256).Hash
            $sourceHash = (Get-FileHash $env:qtkeychain_dll -Algorithm SHA256).Hash
            if ($existingHash -ne $sourceHash) {
              Write-Error "Qt bin đã có qt6keychain.dll khác với bản vừa build."
              exit 1
            }
          } else {
            Copy-Item $env:qtkeychain_dll -Destination $scannerKeychain -Force `
              -ErrorAction Stop
            $scannerShimCreated = $true
          }

          $deployExitCode = 1
          try {
            & $windeployqt `
              "--release" `
              "--verbose" "2" `
              "--qmldir" $env:project_path `
              "$stage\nunchuk-qt.exe"
            $deployExitCode = $LASTEXITCODE
          } finally {
            if ($scannerShimCreated -and `
                (Test-Path $scannerKeychain -PathType Leaf)) {
              Remove-Item $scannerKeychain -Force -ErrorAction Stop
              Write-Host "Removed temporary windeployqt scanner shim."
            }
          }
          if ($deployExitCode -ne 0) {
            Write-Error "windeployqt failed with exit code $deployExitCode"
            exit $deployExitCode
          }

      # ----------------------------------------------------------------------
      # Bổ sung runtime ngoài Qt vào staging. Dependency vcpkg là static archive
      # nhưng dùng CRT động (/MD); qt6keychain vẫn là DLL riêng.
      # ----------------------------------------------------------------------
      - name: Stage application files
        shell: pwsh
        env:
          vcpkg_bin: ${{ github.workspace }}/vcpkg/installed/${{ env.VCPKG_TRIPLET }}/bin
          qtkeychain_dll: C:/qtkeychainInstalled/bin/qt6keychain.dll
        run: |
          $stage = "staging"
          if (!(Test-Path $stage)) {
            Write-Error "❌ staging dir not found (bước Deploy with windeployqt phải chạy trước)"
            exit 1
          }

          # Nếu một port static vẫn phát sinh runtime DLL, copy chúng. Thư mục
          # bin không tồn tại là trạng thái bình thường của triplet static.
          if (Test-Path $env:vcpkg_bin) {
            Get-ChildItem -Path $env:vcpkg_bin -Filter *.dll | ForEach-Object {
              Copy-Item $_.FullName -Destination $stage -Force
              Write-Host "📌 Copied vcpkg DLL: $($_.Name)"
            }
          } else {
            Write-Host "Không có vcpkg runtime DLL (đúng với static triplet)."
          }

          # QtKeychain đã được pre-stage làm runtime; scanner dùng mirror tạm
          # trong Qt bin. Xác nhận file phát hành vẫn đúng bản vừa build.
          $stagedKeychain = Join-Path $stage "qt6keychain.dll"
          if (!(Test-Path $stagedKeychain -PathType Leaf)) {
            Write-Error "qt6keychain.dll bị thiếu sau bước windeployqt."
            exit 1
          }
          $sourceKeychainHash = (Get-FileHash $env:qtkeychain_dll `
            -Algorithm SHA256).Hash
          $stagedKeychainHash = (Get-FileHash $stagedKeychain `
            -Algorithm SHA256).Hash
          if ($sourceKeychainHash -ne $stagedKeychainHash) {
            Write-Error "qt6keychain.dll trong staging không khớp bản vừa build."
            exit 1
          }
          Write-Host "qt6keychain.dll pre-stage integrity: PASS"

          # Qt5Compat.GraphicalEffects nạp ShaderTools động; copy rõ ràng để
          # không phụ thuộc khả năng phát hiện QML runtime của windeployqt.
          $shaderTools = "$env:QT_DIR\bin\Qt6ShaderTools.dll"
          if (!(Test-Path $shaderTools)) {
            Write-Error "Qt6ShaderTools.dll not found at $shaderTools"
            exit 1
          }
          Copy-Item $shaderTools -Destination $stage -Force

          # UI dùng GIF/SVG trực tiếp. Copy có chủ đích để không phụ thuộc kết
          # quả suy luận plugin động của windeployqt.
          $imageRuntimeFiles = @(
            @("$env:QT_DIR\bin\Qt6Svg.dll", "$stage\Qt6Svg.dll"),
            @("$env:QT_DIR\plugins\imageformats\qgif.dll", "$stage\imageformats\qgif.dll"),
            @("$env:QT_DIR\plugins\imageformats\qjpeg.dll", "$stage\imageformats\qjpeg.dll"),
            @("$env:QT_DIR\plugins\imageformats\qsvg.dll", "$stage\imageformats\qsvg.dll"),
            @("$env:QT_DIR\plugins\iconengines\qsvgicon.dll", "$stage\iconengines\qsvgicon.dll")
          )
          foreach ($item in $imageRuntimeFiles) {
            $source = $item[0]
            $destination = $item[1]
            if (!(Test-Path $source)) {
              Write-Error "Qt SVG runtime not found at $source"
              exit 1
            }
            New-Item -ItemType Directory -Path (Split-Path $destination) `
              -Force | Out-Null
            Copy-Item $source -Destination $destination -Force
          }

          Write-Host "---- Staging contents ----"
          Get-ChildItem $stage | Select-Object Name, Length

      # Lấy đúng redistributable x64 từ cùng bộ MSVC dùng để build.
      - name: Stage target Visual C++ Redistributable
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) {
            Write-Error "vswhere.exe không tồn tại."
          if ([string]::IsNullOrWhiteSpace($env:VCToolsRedistDir)) {
            Write-Error "VCToolsRedistDir không được thiết lập bởi MSVC đã pin."
            exit 1
          }
          $vsInstall = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (!$vsInstall) {
            Write-Error "Không tìm thấy Visual Studio có MSVC."
          $redistRoot = (Resolve-Path $env:VCToolsRedistDir).Path
          $redistPath = Join-Path $redistRoot $env:VC_REDIST
          if (!(Test-Path $redistPath -PathType Leaf)) {
            Get-ChildItem $redistRoot -Recurse -File `
              -Filter $env:VC_REDIST -ErrorAction SilentlyContinue | `
              Select-Object FullName
            Write-Error "$env:VC_REDIST không tồn tại trong VCToolsRedistDir đã pin: $redistRoot"
            exit 1
          }

          $redist = Get-ChildItem "$vsInstall\VC\Redist\MSVC" -Recurse -File `
            -Filter $env:VC_REDIST -ErrorAction SilentlyContinue | `
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $redist) {
            Write-Error "Không tìm thấy $env:VC_REDIST trong MSVC Redist."
            exit 1
          }
          $redist = Get-Item $redistPath -ErrorAction Stop
          Copy-Item $redist.FullName "staging\$env:VC_REDIST" -Force
          Write-Host "Staged VC Redistributable: $($redist.FullName)"
          Write-Host "Staged VC Redistributable từ toolset đang dùng: $($redist.FullName)"
          Write-Host "VC Redistributable file version: $($redist.VersionInfo.FileVersion)"

      - name: Restrict optional Qt plugin backends
        shell: pwsh
        run: |
          $stage = "staging"

          $sqlDir = Join-Path $stage "sqldrivers"
          $sqlite = Join-Path $sqlDir "qsqlite.dll"
          if (!(Test-Path $sqlite)) {
            Write-Error "Qt SQLite driver không tồn tại trong staging."
            exit 1
          }
          Get-ChildItem $sqlDir -Filter "*.dll" | Where-Object {
            $_.Name -ne "qsqlite.dll"
          } | Remove-Item -Force -Verbose

          $multimediaDir = Join-Path $stage "multimedia"
          $ffmpeg = Get-ChildItem $multimediaDir -Filter "*ffmpeg*mediaplugin.dll" `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $ffmpeg) {
            Write-Error "Qt FFmpeg multimedia plugin không tồn tại trong staging."
            exit 1
          }
          Get-ChildItem $multimediaDir -Filter "*.dll" | Where-Object {
            $_.FullName -ne $ffmpeg.FullName
          } | Remove-Item -Force -Verbose

          $positionDir = Join-Path $stage "position"
          if (Test-Path $positionDir) {
            Remove-Item $positionDir -Recurse -Force
          }

      # ----------------------------------------------------------------------
      # Bundle HWI (hardware wallet) cho Windows - đồng bộ với Linux/macOS.
      # ----------------------------------------------------------------------
      - name: Download and bundle HWI
        shell: pwsh
        env:
          HWI_URL: https://github.com/nogibi/HWI/releases/download/3.2.0-displayaddress/hwi-3.2.0-windows-x86_64.zip
          HWI_SHA256: 936b57ed68d6f949fbade7b6e4352c6fef5a851d341052ceaefd050abf317644
        run: |
          $stage = "staging"
          $zip = "$env:TEMP\hwi.zip"
          $out = "$env:TEMP\hwi-extracted"

          Write-Host "Downloading HWI from $env:HWI_URL"
          Invoke-WebRequest -Uri $env:HWI_URL -OutFile $zip
          $actualHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:HWI_SHA256) {
            Write-Error "HWI checksum mismatch: $actualHash"
            exit 1
          }
          if (Test-Path $out) { Remove-Item -Recurse -Force $out }
          Expand-Archive -Path $zip -DestinationPath $out -Force

          # Tìm hwi.exe trong gói giải nén (đề phòng cấu trúc thư mục lồng nhau)
          $hwi = Get-ChildItem -Path $out -Recurse -Filter "hwi.exe" | Select-Object -First 1
          if ($null -eq $hwi) {
            Write-Error "❌ hwi.exe not found in extracted HWI archive"
            Get-ChildItem -Path $out -Recurse | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Copy-Item $hwi.FullName -Destination $stage -Force
          Write-Host "✅ Bundled $($hwi.Name) into $stage"

      - name: Verify staged Windows runtime
        shell: pwsh
        run: |
          $stage = (Resolve-Path "staging").Path
          $requiredFiles = @(
            "nunchuk-qt.exe",
            "hwi.exe",
            "qt6keychain.dll",
            "Qt6Core.dll",
            "Qt6Qml.dll",
            "Qt6Quick.dll",
            "Qt6Multimedia.dll",
            "Qt6Svg.dll",
            "Qt6ShaderTools.dll",
            "Qt6WebEngineCore.dll",
            "Qt6WebEngineWidgets.dll",
            "platforms\qwindows.dll",
            "imageformats\qgif.dll",
            "imageformats\qjpeg.dll",
            "imageformats\qsvg.dll",
            "iconengines\qsvgicon.dll",
            "sqldrivers\qsqlite.dll",
            "tls\qschannelbackend.dll",
            "$env:VC_REDIST"
          )
          foreach ($relativePath in $requiredFiles) {
            $path = Join-Path $stage $relativePath
            if (!(Test-Path $path)) {
              Write-Error "Staging thiếu runtime bắt buộc: $relativePath"
              exit 1
            }
          }

          function Assert-StagedMatch {
            param([string]$SearchRoot, [string]$Filter, [string]$Label)
            $found = Get-ChildItem $SearchRoot -Recurse -File -Filter $Filter `
              -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -eq $found) {
              Write-Error "Staging thiếu runtime bắt buộc: $Label"
              exit 1
            }
          }
          Assert-StagedMatch `
            "$stage\qml\Qt5Compat\GraphicalEffects\private" `
            "*graphicaleffectsprivateplugin.dll" `
            "Qt5Compat GraphicalEffects private plugin"
          Assert-StagedMatch "$stage\multimedia" "*ffmpeg*mediaplugin.dll" "FFmpeg multimedia plugin"
          Assert-StagedMatch $stage "QtWebEngineProcess.exe" "QtWebEngineProcess.exe"
          Assert-StagedMatch $stage "qtwebengine_resources.pak" "qtwebengine_resources.pak"
          Assert-StagedMatch $stage "qtwebengine_resources_100p.pak" "QtWebEngine 100% resources"
          Assert-StagedMatch $stage "qtwebengine_resources_200p.pak" "QtWebEngine 200% resources"
          Assert-StagedMatch $stage "icudtl.dat" "QtWebEngine ICU data"
          Assert-StagedMatch $stage "v8_context_snapshot.bin" "QtWebEngine V8 snapshot"
          Assert-StagedMatch `
            "$stage\translations\qtwebengine_locales" `
            "en-US.pak" `
            "QtWebEngine en-US locale"

          $debugQtDlls = Get-ChildItem $stage -Recurse -File -Filter "Qt6*d.dll"
          if ($debugQtDlls.Count -gt 0) {
            Write-Error "Staging Release chứa Qt debug DLL: $($debugQtDlls.Name -join ', ')"
            exit 1
          }

          $dumpbin = (Get-Command dumpbin.exe -ErrorAction Stop).Source

          # Mọi DLL và EXE runtime phải là x64. VC Redistributable là
          # bootstrapper nên không kiểm tra bằng cùng quy tắc.
          $targetPeFiles = Get-ChildItem $stage -Recurse -File | Where-Object {
            $_.Extension -eq ".dll" -or `
            ($_.Extension -eq ".exe" -and `
             $_.Name -notmatch '^vc_redist\..+\.exe$')
          }
          foreach ($file in $targetPeFiles) {
            $headers = & $dumpbin /HEADERS $file.FullName 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0 -or `
                $headers -notmatch $env:TARGET_MACHINE_PATTERN) {
              Write-Error "$($file.FullName) không phải PE $env:TARGET_ARCH hợp lệ."
              exit 1
            }
          }

          $peFiles = Get-ChildItem $stage -Recurse -File | Where-Object {
            $_.Extension -in @(".exe", ".dll")
          }
          $stagedNames = @{}
          foreach ($file in $peFiles) {
            $stagedNames[$file.Name.ToLowerInvariant()] = $true
          }

          $missing = [System.Collections.Generic.HashSet[string]]::new()
          foreach ($file in $peFiles) {
            $output = & $dumpbin /DEPENDENTS $file.FullName 2>&1
            if ($LASTEXITCODE -ne 0) {
              [void]$missing.Add("$($file.Name): dumpbin failed")
              continue
            }

            foreach ($line in $output) {
              if ($line -notmatch '^\s+([A-Za-z0-9_.+\-]+\.dll)\s*$') {
                continue
              }
              $dependency = $Matches[1]
              $dependencyKey = $dependency.ToLowerInvariant()
              if ($stagedNames.ContainsKey($dependencyKey)) {
                continue
              }
              if ($dependencyKey.StartsWith("api-ms-win-") -or `
                  $dependencyKey.StartsWith("ext-ms-win-")) {
                continue
              }

              $system32 = Join-Path "$env:WINDIR\System32" $dependency
              $windows = Join-Path $env:WINDIR $dependency
              if (!(Test-Path $system32) -and !(Test-Path $windows)) {
                [void]$missing.Add("$($file.Name) -> $dependency")
              }
            }
          }

          if ($missing.Count -gt 0) {
            Write-Host "---- Missing staged DLL dependencies ----"
            $missing | Sort-Object | ForEach-Object { Write-Host $_ }
            exit 1
          }
          Write-Host "Windows runtime dependency closure: PASS ($($peFiles.Count) PE files)"

      # ----------------------------------------------------------------------
      # Tạo installer bằng Inno Setup.
      # ----------------------------------------------------------------------
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          # Hỗ trợ cả Inno Setup 6 và 7, bản 32-bit hoặc 64-bit.
          & choco upgrade innosetup `
            "--version=$env:INNO_SETUP_VERSION" `
            --allow-downgrade --no-progress --yes
          $chocoExitCode = $LASTEXITCODE
          $validChocoExitCodes = @(0, 1641, 3010)
          if ($chocoExitCode -notin $validChocoExitCodes) {
            Write-Host "::error::Cài Inno Setup $env:INNO_SETUP_VERSION thất bại với exit code $chocoExitCode"
            exit $chocoExitCode
          }

          # Tìm đúng compiler có file version đã pin, không chọn theo tên/path.
          $roots = @($env:ProgramFiles, ${env:ProgramFiles(x86)}) | `
            Where-Object { $_ -and (Test-Path $_) }
          $iscc = $roots | ForEach-Object {
          $isccCandidates = @($roots | ForEach-Object {
            Get-ChildItem "$_\Inno Setup *\ISCC.exe" -File `
              -ErrorAction SilentlyContinue
          } | Where-Object {
            $_.DirectoryName -match 'Inno Setup [67]'
          } | Sort-Object FullName -Descending | Select-Object -First 1
            $fileVersion = [string]$_.VersionInfo.FileVersion
            $fileVersion -match '^(\d+\.\d+\.\d+)' -and `
              $Matches[1] -ceq $env:INNO_SETUP_VERSION
          })
          $iscc = $isccCandidates | Sort-Object FullName | `
            Select-Object -First 1
          if ($null -eq $iscc) {
            Write-Error "ISCC.exe không tồn tại sau khi cài Inno Setup."
            Write-Error "Không tìm thấy ISCC.exe version $env:INNO_SETUP_VERSION sau khi cài."
            exit 1
          }
          $actualInnoVersion = `
            ([regex]::Match(
              [string]$iscc.VersionInfo.FileVersion,
              '^(\d+\.\d+\.\d+)'
            )).Groups[1].Value
          "ISCC=$($iscc.FullName)" | Out-File $env:GITHUB_ENV `
            -Encoding utf8 -Append
          Write-Host "Inno Setup version pin: PASS ($actualInnoVersion)"
          Write-Host "Using Inno Setup compiler: $($iscc.FullName)"
          Write-Host "Using compiler: $($iscc.FullName)"

      - name: Generate Inno Setup script
        shell: pwsh
        run: |
          # Inno Setup yêu cầu AppVersion dạng số x.y.z; tag có thể có tiền tố/hậu tố.
          # Lấy phần số đầu tiên, fallback 0.0.0 nếu không match.
          $rawVersion = "${{ env.LATEST_VERSION }}"
          if ($rawVersion -match '(\d+(\.\d+){1,3})') { $appVersion = $Matches[1] } else { $appVersion = "0.0.0" }
          # Inno Setup yêu cầu AppVersion dạng số. Tag được phép có prefix/suffix,
          # nhưng phải chứa duy nhất một version gồm 2-4 nhóm số.
          $rawVersion = $env:LATEST_VERSION
          $versionMatches = [regex]::Matches(
            $rawVersion,
            '(?<!\d)(\d+\.\d+(?:\.\d+){0,2})(?!\d)'
          )
          if ($versionMatches.Count -ne 1) {
            Write-Error "Tag không chứa duy nhất một AppVersion hợp lệ: '$rawVersion'"
            exit 1
          }
          $appVersion = $versionMatches[0].Groups[1].Value
          echo "APP_VERSION=$appVersion" >> $env:GITHUB_ENV
          Write-Host "Installer AppVersion = $appVersion (from tag '$rawVersion')"

          $iss = @"
          #define MyAppName "Nunchuk"
          #define MyAppVersion "$appVersion"
          #define MyAppExeName "nunchuk-qt.exe"

          [Setup]
          AppId={{8F1B9C2A-4D3E-4A21-9C7B-1E2F3A4B5C6D}}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher=Nunchuk
          DefaultDirName={autopf}\{#MyAppName}
          DefaultGroupName={#MyAppName}
          UninstallDisplayIcon={app}\{#MyAppExeName}
          OutputDir=installer
          OutputBaseFilename=nunchuk-windows-$env:TARGET_ARCH-v$appVersion-setup
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=$env:INSTALLER_ARCH_ALLOWED
          ArchitecturesInstallIn64BitMode=$env:INSTALLER_64BIT_MODE
          MinVersion=10.0
          PrivilegesRequired=admin
          WizardStyle=modern
          CloseApplications=yes
          RestartApplications=no
          VersionInfoVersion={#MyAppVersion}
          VersionInfoCompany=Nunchuk
          VersionInfoDescription=Nunchuk Bitcoin Wallet Installer
          VersionInfoProductName={#MyAppName}
          VersionInfoProductVersion={#MyAppVersion}

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked

          [Files]
          Source: "staging\*"; Excludes: "vc_redist.*.exe"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs ignoreversion
          Source: "staging\$env:VC_REDIST"; DestDir: "{tmp}"; Flags: deleteafterinstall

          [Icons]
          Name: "{group}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          Name: "{group}\{cm:UninstallProgram,{#MyAppName}}"; Filename: "{uninstallexe}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon

          [Run]
          Filename: "{tmp}\$env:VC_REDIST"; Parameters: "/install /quiet /norestart"; StatusMsg: "Installing Microsoft Visual C++ Runtime..."; Flags: runhidden waituntilterminated
          Filename: "{app}\{#MyAppExeName}"; Description: "{cm:LaunchProgram,{#StringChange(MyAppName, '&', '&&')}}"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content -Path "nunchuk.iss" -Value $iss -Encoding UTF8
          Write-Host "---- nunchuk.iss ----"
          Get-Content "nunchuk.iss"

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "installer" -Force | Out-Null
          & "${{ env.ISCC }}" "nunchuk.iss"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Write-Host "---- installer dir ----"
          $installers = @(Get-ChildItem "installer" -Filter "*.exe" -File)
          if ($installers.Count -ne 1) {
            Write-Error "Expected exactly one installer, found $($installers.Count)."
            exit 1
          }
          Get-ChildItem "installer"

      - name: Smoke test installer contents
        shell: pwsh
        timeout-minutes: 10
        run: |
          $installer = Get-ChildItem "installer" -Filter "*.exe" -File | `
            Select-Object -First 1
          if ($null -eq $installer) {
            Write-Error "Installer not found."
            exit 1
          }

          $installDir = Join-Path $env:TEMP "NunchukInstallerSmoke"
          $installLog = Join-Path $env:TEMP "nunchuk-installer-smoke.log"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          if (Test-Path $installLog) { Remove-Item $installLog -Force }

          function Show-InstallerLog {
            if (Test-Path $installLog -PathType Leaf) {
              Write-Host "---- Inno Setup smoke log (last 250 lines) ----"
              Get-Content $installLog -Tail 250
            } else {
              Write-Host "Inno Setup không tạo smoke log: $installLog"
            }
          }

          $installerArgs = @(
            "/VERYSILENT"
            "/SUPPRESSMSGBOXES"
            "/NORESTART"
            "/NOCANCEL"
            "/SP-"
            "/NOICONS"
            "/DIR=`"$installDir`""
            '/TASKS=""'
            "/LOG=`"$installLog`""
          )
          Write-Host "Running silent installer: $($installer.FullName)"

          try {
            # Inno Setup là GUI executable. -Wait chờ toàn bộ process tree;
            # -PassThru cung cấp ExitCode thật thay vì dựa vào $LASTEXITCODE.
            $installerProcess = Start-Process `
              -FilePath $installer.FullName `
              -ArgumentList $installerArgs `
              -Wait -PassThru -ErrorAction Stop
          } catch {
            Show-InstallerLog
            Write-Error "Không thể chạy silent installer: $($_.Exception.Message)"
            exit 1
          }

          $installerExitCode = $installerProcess.ExitCode
          Write-Host "Inno Setup exit code: $installerExitCode"
          if ($installerExitCode -ne 0) {
            Show-InstallerLog
            Write-Error "Silent installer smoke test failed with exit code $installerExitCode."
            exit $installerExitCode
          }

          foreach ($file in @(
            "nunchuk-qt.exe",
            "hwi.exe",
            "qt6keychain.dll",
            "Qt6Core.dll",
            "Qt6ShaderTools.dll",
            "Qt6WebEngineCore.dll",
            "platforms\qwindows.dll",
            "qml\Qt5Compat\GraphicalEffects\private",
            "unins000.exe"
          )) {
            if (!(Test-Path (Join-Path $installDir $file))) {
              Show-InstallerLog
              Write-Error "Installed application thiếu: $file"
              exit 1
            }
          }
          Write-Host "Installer smoke test: PASS"

      - name: Upload installer smoke log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nunchuk-windows-x64-installer-smoke-log
          path: ${{ runner.temp }}/nunchuk-installer-smoke.log
          if-no-files-found: ignore

      - name: Zip deployed release folder
        if: env.UPLOAD_BUILT == 'true'
        shell: pwsh
        run: |
          $src = "staging"
          $dst = "nunchuk-qt-windows-x64.zip"
          if (!(Test-Path $src)) {
            Write-Error "❌ Cannot zip: Folder $src does not exist"
            exit 1
          }
          Compress-Archive -Path "$src\*" -DestinationPath $dst -Force
          Write-Host "✅ Zipped $src to $dst"

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
