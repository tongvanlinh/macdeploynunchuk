          }
          if ($compileDb -notmatch '(?i)(?:^|[\s"])[\/-]MD(?=[\s"]|$)') {
            Write-Error "Không xác nhận được QtKeychain đang dùng dynamic CRT (/MD)."
            exit 1
          }
          Write-Host "QtKeychain MSVC runtime /MD: PASS"

          cmake --build build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          echo "QTKEYCHAIN_PATH=C:/qtkeychainInstalled" >> $env:GITHUB_ENV
          
